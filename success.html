<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding | Edge Landings</title><style>body{margin:0;background:#040711;color:#eef3ff;font:16px/1.5 Arial,sans-serif}.wrap{width:min(720px,calc(100% - 32px));margin:50px auto}form{display:grid;gap:14px;background:#0b1220;padding:28px;border-radius:16px}label{font-weight:700}input,textarea,select{font:inherit;padding:10px;border-radius:7px;border:1px solid #345;background:#07101d;color:#eef3ff}textarea{min-height:92px}button{padding:14px;background:#00f18c;border:0;border-radius:999px;font-weight:800;cursor:pointer}button:disabled{opacity:.65}.muted,#status{color:#b9c8dd}.error{color:#ffaaa5}</style></head>
<body><main class="wrap"><h1>Thanks — tell us about your site.</h1><p class="muted">Submit this form after checkout. We will confirm receipt by email. Your first draft is due within 3 business days after we receive the content needed for your site.</p>
<form id="onboarding"><label>Business name<input name="businessName" required></label><label>Owner name<input name="ownerName" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" type="tel" required></label><label>Existing website URL (optional)<input name="existingUrl" type="url" placeholder="https://"></label><label>Business type<input name="businessType" required></label><label>Goals<textarea name="goals" required></textarea></label><label>Required pages<textarea name="requiredPages" required placeholder="For example: Home, About, Services, Reviews, Contact"></textarea></label><label>Notes (optional)<textarea name="notes"></textarea></label><button type="submit">Send onboarding details</button><p id="status" role="status" aria-live="polite"></p></form></main>
<script>const form=document.getElementById('onboarding'),status=document.getElementById('status'),button=form.querySelector('button'),sessionId=new URLSearchParams(location.search).get('session_id');if(!sessionId){button.disabled=true;status.className='error';status.textContent='A completed checkout session is required before onboarding can be submitted.'}form.addEventListener('submit',async event=>{event.preventDefault();if(!sessionId)return;button.disabled=true;status.className='';status.textContent='Verifying payment and sending your details...';try{const data={...Object.fromEntries(new FormData(form)),sessionId};const response=await fetch('/api/onboarding',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const payload=await response.json();if(!response.ok||!payload.success)throw new Error(payload.error||'We could not send your details.');form.reset();status.textContent='We received your onboarding details. Please check your email for confirmation.'}catch(error){status.className='error';status.textContent=error.message||'We could not send your details. Please try again.';button.disabled=false}});</script></body></html>
